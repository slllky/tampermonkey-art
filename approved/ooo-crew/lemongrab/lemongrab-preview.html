<html lang="en">
<meta charset="utf-8">

<title>Lemongrab · Ooo Crew sprite review</title>
<style>
*{box-sizing:border-box}
:root{--ink:#262932;--paper:#f8f4e3;--citron:#f7e33c;--dark:#34373c;--serif:Georgia,"Times New Roman",serif;--mono:"Courier Prime","Courier New",monospace}
body{margin:0;background:#eeead9;color:var(--ink);font-family:var(--serif);padding:clamp(16px,5vw,68px) 16px}
main{max-width:880px;margin:auto;border:2px solid var(--ink);background:var(--paper);box-shadow:5px 5px 0 #aca88f}
header{padding:20px 28px 22px;border-bottom:2px solid var(--ink);background:var(--citron);position:relative}
header p{font:700 .75rem var(--mono);letter-spacing:.12em;text-transform:uppercase;margin:0 0 .25rem}
h1{font:italic bold clamp(2.6rem,7vw,4.5rem)/.96 var(--serif);letter-spacing:-.065em;margin:0}
.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(220px,.85fr)}
.stage{position:relative;overflow:hidden;min-height:320px;display:grid;place-items:center;isolation:isolate;background:var(--stage,#d0ddcc);color:#48604d}
.stage[data-back="night"]{--stage:#273146;color:#acbac8}
.stage[data-back="paper"]{--stage:#fffdf5;color:#68634f}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,currentColor 0 1px,transparent 1.2px) 0 0 / 8px 8px;opacity:.105;z-index:-1}
.stage::after{content:"";position:absolute;z-index:-1;width:82%;height:87%;bottom:-12%;border:1px solid currentColor;outline:5px double currentColor;outline-offset:7px;border-radius:50% 50% 0 0;opacity:.3}
.crossbar{position:absolute;left:12%;right:12%;height:1px;background:currentColor;bottom:calc(50% - var(--ground,112px));opacity:.32}
canvas{display:block;image-rendering:pixelated}
#actor{width:min(256px,78vw);height:auto;position:relative}
#actor.actual{width:min(128px,78vw)}
.controls{border-left:2px solid var(--ink);padding:25px 22px}
fieldset{padding:0;border:none;margin:0 0 19px;min-width:0}
legend,h2{font:bold .74rem var(--mono);letter-spacing:.105em;text-transform:uppercase;margin-bottom:10px;padding:0}
.options{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;cursor:pointer;color:var(--ink);padding:6px 11px;background:var(--paper);border:1px solid var(--ink);line-height:1.2;min-height:38px}
button:hover{background:#e5e6ce}
button[aria-pressed=true]{background:var(--ink);color:#fffdf0}
button:focus-visible{outline:3px solid #cf4d28;outline-offset:3px}
#motions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
#motions button{font-weight:bold;padding:9px 3px}
#motions button[aria-pressed=true]{background:var(--citron);color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.transport{display:flex;gap:6px;flex-wrap:wrap}
.transport button,.options.small button{font:700 .79rem var(--mono)}
.strip{padding:15px 22px 19px;border-top:2px solid var(--ink)}
h2{margin:0}
.strip-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
#counter{font:.76rem var(--mono)}
#frames{display:flex;flex-wrap:wrap;gap:7px}
.thumb{display:grid;place-items:center;padding:1px 4px;height:56px;min-width:58px;border:1px solid #a9aa99;background:#eeeedd}
.thumb[aria-pressed=true]{background:#f4eebd;border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.thumb canvas{width:48px;height:48px}
@media(max-width:620px){.layout{grid-template-columns:1fr}.controls{border-left:0;border-top:1px solid var(--ink);padding:16px}.stage{min-height:272px}.controls fieldset{margin-bottom:12px}#motions{grid-template-columns:repeat(4,minmax(0,1fr))}header,.strip{padding:16px}.transport{margin-top:2px}}
</style>

const data=JSON.parse(document.getElementById('metadata').textContent);

play.onclick=()=>setPlaying(!playing);
flip.onclick=()=>{
